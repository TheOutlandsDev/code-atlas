name: Native published VSIX acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Linux / VS Code 1.143.0 / published VSIX
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install virtual-display capture prerequisites
        run: |
          set -euo pipefail
          # Avoid the image's mirror-list indirection; keep TLS and Ubuntu signature checks.
          apt_dir="$(mktemp -d /tmp/code-atlas-apt.XXXXXXXX)"
          chmod 0755 "$apt_dir"
          mkdir -m 0755 "$apt_dir/sources.list.d" "$apt_dir/lists"
          cat > "$apt_dir/sources.list" <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu jammy-security main universe
          SOURCES
          chmod 0644 "$apt_dir/sources.list"
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          timeout 15s getent ahosts archive.ubuntu.com
          timeout 15s getent ahosts security.ubuntu.com
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_dir/sources.list"
            -o "Dir::Etc::sourceparts=$apt_dir/sources.list.d"
            -o "Dir::State::lists=$apt_dir/lists"
            -o APT::Update::Error-Mode=any
            -o Acquire::Retries=0
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends xvfb openbox imagemagick libnss3 libgbm1 libxkbfile1 libsecret-1-0 libgtk-3-0 libasound2
          for required in Xvfb xvfb-run xauth openbox import; do
            command -v "$required"
          done
      - name: Exercise installed extension on first launch and restart
        run: >-
          xvfb-run -a -s "-screen 0 1920x1440x24"
          python3 -I -B tools/check_native.py --ci-window-manager
          --artifacts-dir "$RUNNER_TEMP/code-atlas-native-artifacts"
      - name: Retain scoped native reports and fictional captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-atlas-native-linux
          path: ${{ runner.temp }}/code-atlas-native-artifacts/
          if-no-files-found: error
          retention-days: 14
